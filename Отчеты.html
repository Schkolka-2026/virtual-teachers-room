<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Отчеты</title></head><body>
<script type="text/plain" data-module>
/* REPORTS.JS — Reports module */
(function(){
/* ---------- Reports → 1 trimester: Input diagnostics ---------- */
function inputDiagnosticTeacherName(name){const parts=String(name||'').trim().split(/\s+/).filter(Boolean);if(!parts.length)return '';return parts[0]+(parts[1]?' '+parts[1][0]+'.':'')+(parts[2]?' '+parts[2][0]+'.':'');}
function inputDiagnosticClasses(){const app = window.App?.state || {};const names=new Set();(app.classRoster||[]).forEach(r=>{if(r?.name)names.add(String(r.name).trim());});(app.users||[]).forEach(u=>[...(u.classes||[]),...(u.attendanceClasses||[])].forEach(c=>{if(c)names.add(String(c).trim());}));const cmp=window.classSort||((a,b)=>String(a).localeCompare(String(b),'ru'));return [...names].filter(Boolean).sort(cmp);}
function renderInputDiagnostics(){
  const app = window.App?.state || {};
  const classes = inputDiagnosticClasses();
  const teacher = inputDiagnosticTeacherName(app.currentUser?.name || '');

 const appShell = window.shell;

if (typeof appShell !== 'function') {
  return alert('Не найдена функция отображения формы. Обновите страницу.');
}

  const esc = window.escapeHtml || (s => String(s ?? ''));
  const today = window.dateInfo
    ? window.dateInfo().iso
    : new Date().toISOString().slice(0, 10);

  appShell(
    'Отчеты за 1 триместр',
    'Входная диагностика',
    `<div class="card">
      <h3>Входная диагностика</h3>

      <div class="diag-form">

        <div class="diag-row diag-meta-row">
          <div class="diag-field">
            <label for="diagClass">Класс</label>
            <select id="diagClass">
              <option value="">Выберите класс</option>
              ${classes.map(c =>
                `<option value="${esc(c)}">${esc(c)}</option>`
              ).join('')}
            </select>
          </div>

          <div class="diag-field">
            <label for="diagSubject">Предмет</label>
            <input id="diagSubject" type="text" placeholder="Введите предмет">
          </div>

          <div class="diag-field">
            <label for="diagTeacher">Учитель</label>
            <input id="diagTeacher" type="text"
                   value="${esc(teacher)}" readonly>
          </div>

          <div class="diag-field">
            <label for="diagDate">Дата проведения</label>
            <input id="diagDate" type="date" value="${today}">
          </div>
        </div>

        <div class="diag-row diag-results-row">
          <div class="diag-field">
            <label for="diagStudents">Кол-во писавших</label>
            <input id="diagStudents" type="number" min="0" step="1"
                   inputmode="numeric" oninput="recalcInputDiagnostic()">
          </div>

          <div class="diag-field">
            <label>Результаты</label>
            <div class="target-grid target-grid-four">
              <label>2
                <input id="diagGrade2" type="number" min="0" step="1"
                       oninput="recalcInputDiagnostic()">
              </label>
              <label>3
                <input id="diagGrade3" type="number" min="0" step="1"
                       oninput="recalcInputDiagnostic()">
              </label>
              <label>4
                <input id="diagGrade4" type="number" min="0" step="1"
                       oninput="recalcInputDiagnostic()">
              </label>
              <label>5
                <input id="diagGrade5" type="number" min="0" step="1"
                       oninput="recalcInputDiagnostic()">
              </label>
            </div>
          </div>
        </div>

        <div class="diag-row diag-summary-row">
          <div class="diag-field">
            <label for="diagAchievement">Успеваемость</label>
            <input id="diagAchievement" type="text" readonly value="0,00%">
          </div>

          <div class="diag-field">
            <label for="diagQuality">Качество</label>
            <input id="diagQuality" type="text" readonly value="0,00%">
          </div>
        </div>

        <div class="diag-field">
          <label for="diagCorrection">Планируемая коррекционная работа</label>
          <textarea id="diagCorrection" maxlength="1000" rows="4"
                    placeholder="До 1000 символов"></textarea>
        </div>

        <div class="diag-actions">
          <button class="btn" onclick="openTerm1Folder()">Назад</button>
          <button class="btn green" onclick="submitInputDiagnostic()">
            Отправить
          </button>
          <button class="btn" onclick="viewInputDiagnostics()">
            Посмотреть результаты
          </button>
          <button class="btn" onclick="exportInputDiagnostics()">
            Выгрузить Excel
          </button>
        </div>

        <div id="diagMessage" class="muted"></div>
        <div id="diagResults"></div>

      </div>
    </div>`
  );
}
window.openInputDiagnostics = function() {
  const app = window.App?.state;

  if (!app) {
    return alert('Приложение ещё не готово. Обновите страницу.');
  }

  app.currentPage = 'reports';
  renderInputDiagnostics();
};
window.recalcInputDiagnostic=function(){const total=Number(document.getElementById('diagStudents')?.value)||0,g3=Number(document.getElementById('diagGrade3')?.value)||0,g4=Number(document.getElementById('diagGrade4')?.value)||0,g5=Number(document.getElementById('diagGrade5')?.value)||0,a=total?(g3+g4+g5)/total*100:0,q=total?(g4+g5)/total*100:0,ae=document.getElementById('diagAchievement'),qe=document.getElementById('diagQuality');if(ae)ae.value=a.toFixed(2).replace('.',',')+'%';if(qe)qe.value=q.toFixed(2).replace('.',',')+'%';};
window.submitInputDiagnostic = async function(){
  const cls = document.getElementById('diagClass')?.value.trim();
  const subject = document.getElementById('diagSubject')?.value.trim();
  const assessmentDate = document.getElementById('diagDate')?.value;
  const total = Number(document.getElementById('diagStudents')?.value) || 0;
  const g2 = Number(document.getElementById('diagGrade2')?.value) || 0;
  const g3 = Number(document.getElementById('diagGrade3')?.value) || 0;
  const g4 = Number(document.getElementById('diagGrade4')?.value) || 0;
  const g5 = Number(document.getElementById('diagGrade5')?.value) || 0;

  if (!cls || !subject || !assessmentDate) {
    return alert('Заполните класс, предмет и дату проведения.');
  }

  if (g2 + g3 + g4 + g5 !== total) {
    return alert('Сумма результатов по оценкам 2–5 должна совпадать с количеством писавших работу.');
  }

  const achievement = total ? (g3 + g4 + g5) / total * 100 : 0;
  const quality = total ? (g4 + g5) / total * 100 : 0;

  const payload = {
    class_name: cls,
    subject,
    teacher_employee_id: Number(window.App?.state?.currentUser?.id) || null,
    teacher_name: inputDiagnosticTeacherName(
      window.App?.state?.currentUser?.name || ''
    ),
    assessment_date: assessmentDate,
    students_count: total,
    grade_2: g2,
    grade_3: g3,
    grade_4: g4,
    grade_5: g5,
    achievement_percent: Number(achievement.toFixed(2)),
    quality_percent: Number(quality.toFixed(2)),
    correction_work:
      document.getElementById('diagCorrection')?.value.trim() || ''
  };

  try {
    const academicYearId =
      typeof window.getCurrentAcademicYearId === 'function'
        ? await window.getCurrentAcademicYearId()
        : null;

    if (academicYearId != null) {
      payload.academic_year_id = Number(academicYearId) || null;
    }

    if (typeof window.sbMutate !== 'function') {
      throw new Error('Функция сохранения данных не загружена.');
    }

    await window.sbMutate('input_diagnostics', 'POST', '', payload);

    const msg = document.getElementById('diagMessage');
    if (msg) msg.textContent = 'Отчет сохранён.';

    alert('Входная диагностика сохранена.');
  } catch (e) {
    console.error(e);
    alert('Не удалось сохранить отчет: ' + (e.message || e));
  }
};
window.viewInputDiagnostics = async function(){
  const target = document.getElementById('diagResults');
  if (!target) return;

  target.innerHTML = '<p class="muted">Загрузка результатов…</p>';

  try {
    const rows = await window.sbRest(
      'input_diagnostics',
      'select=*'
    );

    const esc = window.escapeHtml || (s => String(s ?? ''));
    const sorted = (rows || []).sort(
      (a, b) => String(b.assessment_date || '')
        .localeCompare(String(a.assessment_date || ''))
    );

    if (!sorted.length) {
      target.innerHTML = '<div class="empty">Сохранённых результатов пока нет.</div>';
      return;
    }

    const headers = [
      'Класс', 'Предмет', 'Учитель', 'Дата проведения',
      'Писали', '2', '3', '4', '5',
      'Успеваемость', 'Качество',
      'Планируемая коррекционная работа'
    ];

    const rowsHtml = sorted.map(r => `
      <tr>
        <td>${esc(r.class_name)}</td>
        <td>${esc(r.subject)}</td>
        <td>${esc(r.teacher_name)}</td>
        <td>${esc(r.assessment_date)}</td>
        <td>${esc(r.students_count)}</td>
        <td>${esc(r.grade_2)}</td>
        <td>${esc(r.grade_3)}</td>
        <td>${esc(r.grade_4)}</td>
        <td>${esc(r.grade_5)}</td>
        <td>${Number(r.achievement_percent || 0).toFixed(2)}%</td>
        <td>${Number(r.quality_percent || 0).toFixed(2)}%</td>
        <td>${esc(r.correction_work)}</td>
      </tr>
    `).join('');

    target.innerHTML = `
      <h3>Сохранённые результаты</h3>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    `;
  } catch (e) {
    console.error(e);
    target.innerHTML = '<div class="empty">Не удалось загрузить результаты.</div>';
    alert('Не удалось получить результаты: ' + (e.message || e));
  }
};

window.exportInputDiagnostics = async function(){
  try {
    const rows = await window.sbRest(
      'input_diagnostics',
      'select=*'
    );

    const headers = [
      'Класс', 'Предмет', 'Учитель', 'Дата проведения',
      'Кол-во писавших', '2', '3', '4', '5',
      'Успеваемость', 'Качество',
      'Планируемая коррекционная работа'
    ];

    const data = (rows || [])
      .sort((a, b) =>
        String(b.assessment_date || '')
          .localeCompare(String(a.assessment_date || ''))
      )
      .map(r => [
        r.class_name,
        r.subject,
        r.teacher_name,
        r.assessment_date,
        r.students_count,
        r.grade_2,
        r.grade_3,
        r.grade_4,
        r.grade_5,
        Number(r.achievement_percent || 0).toFixed(2) + '%',
        Number(r.quality_percent || 0).toFixed(2) + '%',
        r.correction_work
      ]);

    if (window.XLSX) {
      const ws = window.XLSX.utils.aoa_to_sheet([headers, ...data]);
      const wb = window.XLSX.utils.book_new();

      ws['!cols'] = headers.map((h, i) => ({
        wch: i === 11 ? 45 : (i < 4 ? 20 : 16)
      }));

      window.XLSX.utils.book_append_sheet(
        wb, ws, 'Входная диагностика'
      );
      window.XLSX.writeFile(wb, 'входная_диагностика.xlsx');
    } else {
      downloadCSV(headers, data, 'входная_диагностика.csv');
    }
  } catch (e) {
    console.error(e);
    alert('Не удалось получить результаты: ' + (e.message || e));
  }
};

 ['microdistrict_ekodolye','Экодолье'],['microdistrict_priuralye','Приуралье'],
 ['microdistrict_perovsky','Перовский'],['microdistrict_vesenniy','Весенний'],
 ['microdistrict_snt_karachi','СНТ Карачи'],['microdistrict_orenburg','г. Оренбург'],
 ['microdistrict_ivanovka_old','с. Ивановка (старая)'],
 ['microdistrict_ivanovskie_sady_zarya','Ивановские сады, СНТ Заря']
];
const term1Esc = value => (window.escapeHtml || (x => String(x ?? '')))(value);
const term1User = () => window.App?.state?.currentUser || {};
const term1Manager = () => ['admin','director','deputy'].some(r => (term1User().roleKeys || []).includes(r));
const term1AuthId = () => term1User().authUserId || term1User().auth_user_id || null;
const term1Percent = value => Number(value || 0).toFixed(2).replace('.',',') + '%';
const term1Sort = (a,b) => (window.classSort || ((x,y)=>String(x).localeCompare(String(y),'ru')))(a,b);
async function term1Context(){
 const user=term1User(), authId=term1AuthId();
 if(!authId) throw new Error('Не удалось определить учётную запись пользователя.');
 const year=typeof window.getCurrentAcademicYearId==='function'?await window.getCurrentAcademicYearId():null;
 if(year==null||year==='') throw new Error('Не удалось определить текущий учебный год.');
 const links=await window.sbRest('class_leaders','select=class_id&user_id=eq.'+encodeURIComponent(authId));
 const ids=[...new Set((links||[]).map(x=>Number(x.class_id)).filter(Number.isFinite))];
 if(!ids.length) return {year:Number(year),classes:[],user};
 const rows=await window.sbRest('classes','select=id,grade,letter,student_count,academic_year_id&is_active=eq.true&academic_year_id=eq.'+year+'&id=in.('+ids.join(',')+')');
 const classes=(rows||[]).map(x=>({id:Number(x.id),name:String(x.grade||'')+String(x.letter||''),count:Number(x.student_count)||0}))
   .filter(x=>x.name).sort((a,b)=>term1Sort(a.name,b.name));
 return {year:Number(year),classes,user};
}
function term1N(id){
 const raw=String(document.getElementById(id)?.value??'').trim();
 if(!raw)return 0;
 const n=Number(raw);
 if(!Number.isInteger(n)||n<0)throw new Error('В числовых полях допускаются только целые неотрицательные числа.');
 return n;
}
function term1Rate(row){
 const total=Number(row.student_count)||0, ex=Number(row.excellent_count)||0, good=Number(row.good_count)||0, three=Number(row.satisfactory_count)||0;
 return {achievement:total?(ex+good+three)/total*100:0,quality:total?(ex+good)/total*100:0};
}

   </div>

  window.shell('Отчеты за 1 триместр','Итоги 1 триместр',body);
  if(ctx.classes.length)term1ClassChanged();
 }catch(e){console.error(e);alert('Не удалось открыть форму итогов 1 триместра: '+(e.message||e));}
};
window.term1ClassChanged=function(){
 const ctx=window.__term1SummaryContext,sel=document.getElementById('t1class');
 if(!ctx||!sel)return;
 const c=ctx.classes.find(x=>String(x.id)===String(sel.value));
 const count=document.getElementById('t1count');if(count)count.value=c?c.count:0;
 window.recalcTerm1Summary();
};
window.recalcTerm1Summary=function(){
 try{
  const total=Number(document.getElementById('t1count')?.value)||0;
  const district=term1Districts.reduce((s,[k])=>s+term1N('t1_'+k),0);
  const ex=term1N('t1excellent'),good=term1N('t1good'),three=term1N('t1three'),fail=term1N('t1fail'),na=term1N('t1na');
  const grade=ex+good+three+fail+na,one4=term1N('t1goodone4'),one3=term1N('t1threeone3');
  const d=document.getElementById('t1districtcheck'),g=document.getElementById('t1gradecheck');
  if(d)d.textContent='По микрорайонам: '+district+' из '+total+'. '+(district===total?'Сумма совпадает.':'Сумма должна совпадать с количеством учеников.');
  if(g)g.textContent='По категориям: '+grade+' из '+total+'. '+(grade===total?'Сумма совпадает.':'Сумма должна совпадать с количеством учеников.')+(one4>good?' Количество с одной «4» больше числа хорошистов.':'')+(one3>three?' Количество с одной «3» больше числа троечников.':'');
  const achievement=total?(ex+good+three)/total*100:0,quality=total?(ex+good)/total*100:0;
  const a=document.getElementById('t1achievement'),q=document.getElementById('t1quality');
  if(a)a.value=term1Percent(achievement);if(q)q.value=term1Percent(quality);
  return {total,district,grade,one4,one3};
 }catch(e){const g=document.getElementById('t1gradecheck');if(g)g.textContent=e.message||String(e);return null;}
};
function term1Payload(){
 const ctx=window.__term1SummaryContext,id=Number(document.getElementById('t1class')?.value),cls=ctx?.classes.find(x=>x.id===id),uid=term1AuthId();
 if(!cls||!uid)throw new Error('Не удалось определить класс или пользователя.');
 const p={class_id:cls.id,academic_year_id:ctx.year,class_name:cls.name,teacher_user_id:uid,teacher_name:String(ctx.user.name||'').trim(),student_count:cls.count,
 excellent_count:term1N('t1excellent'),excellent_names:document.getElementById('t1excellentnames')?.value.trim()||'',
 good_count:term1N('t1good'),good_one_four_count:term1N('t1goodone4'),satisfactory_count:term1N('t1three'),satisfactory_one_three_count:term1N('t1threeone3'),
 failing_count:term1N('t1fail'),failing_names:document.getElementById('t1failnames')?.value.trim()||'',not_assessed_count:term1N('t1na'),
 not_assessed_details:document.getElementById('t1nadetails')?.value.trim()||'',achievements_text:document.getElementById('t1achievements')?.value.trim()||''};
 term1Districts.forEach(([k])=>p[k]=term1N('t1_'+k));return p;
}
window.saveTerm1Summary=async function(){
 try{
  const c=window.recalcTerm1Summary();if(!c)return alert('Проверьте числовые поля формы.');
  if(c.district!==c.total)return alert('Нельзя отправить отчёт: сумма по 8 микрорайонам не совпадает с количеством учеников.');
  if(c.grade!==c.total)return alert('Нельзя отправить отчёт: сумма пяти категорий не совпадает с количеством учеников.');
  if(c.one4>term1N('t1good')||c.one3>term1N('t1three'))return alert('Количество учеников с одной «4» или одной «3» не может превышать соответствующую категорию.');
  const p=term1Payload();if(!p.teacher_name)throw new Error('Не удалось определить ФИО классного руководителя.');
  const old=await window.sbRest('term1_class_summaries','select=id&class_id=eq.'+p.class_id+'&academic_year_id=eq.'+p.academic_year_id);
  if(old?.length)await window.sbMutate('term1_class_summaries','PATCH','id=eq.'+encodeURIComponent(old[0].id),p);
  else await window.sbMutate('term1_class_summaries','POST','',p);
  const m=document.getElementById('t1message');if(m)m.textContent='Отчёт сохранён. Повторное сохранение обновит строку класса без дубликата.';
  alert('Итоги 1 триместра сохранены.');await window.viewTerm1Summaries();
 }catch(e){console.error(e);alert('Не удалось сохранить отчёт: '+(e.message||e));}
};
window.editTerm1Summary=async function(){
 try{
  const ctx=window.__term1SummaryContext,id=Number(document.getElementById('t1class')?.value);
  if(!ctx||!id)throw new Error('Сначала выберите класс.');
  const rows=await window.sbRest('term1_class_summaries','select=*&class_id=eq.'+id+'&academic_year_id=eq.'+ctx.year);
  if(!rows?.length)return alert('Для выбранного класса сохранённого отчёта пока нет.');
  const r=rows[0];
  term1Districts.forEach(([k])=>{const el=document.getElementById('t1_'+k);if(el)el.value=r[k]??0;});
  const fields={t1excellent:r.excellent_count,t1excellentnames:r.excellent_names,t1good:r.good_count,t1goodone4:r.good_one_four_count,t1three:r.satisfactory_count,t1threeone3:r.satisfactory_one_three_count,t1fail:r.failing_count,t1failnames:r.failing_names,t1na:r.not_assessed_count,t1nadetails:r.not_assessed_details,t1achievements:r.achievements_text};
  Object.entries(fields).forEach(([key,value])=>{const el=document.getElementById(key);if(el)el.value=value??'';});
  window.recalcTerm1Summary();const m=document.getElementById('t1message');if(m)m.textContent='Загружен ранее сохранённый отчёт. После изменений нажмите «Сохранить и отправить».';
 }catch(e){console.error(e);alert('Не удалось загрузить отчёт: '+(e.message||e));}
};
function term1Headers(){
 return ['Класс','Количество учеников','Классный руководитель',...term1Districts.map(x=>x[1]),
 'Отличники — всего','ФИ отличников','Хорошисты всего','В т.ч. с одной «4»','Троечники всего','В т.ч. с одной «3»',
 'Неуспевающие — количество','ФИ неуспевающих','Неаттестованные — количество','ФИ, предмет и причина','Успеваемость','Качество','Достижения класса'];
}
function term1Row(r){
 const rate=term1Rate(r);
 return [r.class_name,r.student_count,r.teacher_name,...term1Districts.map(x=>r[x[0]]),
 r.excellent_count,r.excellent_names,r.good_count,r.good_one_four_count,r.satisfactory_count,r.satisfactory_one_three_count,
 r.failing_count,r.failing_names,r.not_assessed_count,r.not_assessed_details,term1Percent(rate.achievement),term1Percent(rate.quality),r.achievements_text||''];
}
window.viewTerm1Summaries=async function(){
 if((term1User().roleKeys||[]).includes('guest'))return alert('Гостям просмотр отчёта недоступен.');
 const box=document.getElementById('t1table');if(!box)return;box.innerHTML='<p class="muted">Загрузка…</p>';
 try{
  const ctx=window.__term1SummaryContext||await term1Context();
  const [classes,reports]=await Promise.all([
   window.sbRest('classes','select=id,grade,letter,student_count,academic_year_id&is_active=eq.true&academic_year_id=eq.'+ctx.year),
   window.sbRest('term1_class_summaries','select=*&academic_year_id=eq.'+ctx.year)
  ]);
  const reportsByClass=new Map((reports||[]).map(r=>[String(r.class_id),r]));
  const sorted=(classes||[]).map(c=>{
   const className=String(c.grade||'')+String(c.letter||'');
   const saved=reportsByClass.get(String(c.id));
   return {class_id:c.id,class_name:className,student_count:Number(c.student_count)||0,teacher_name:'',...(saved||{})};
  }).filter(r=>r.class_name).sort((a,b)=>term1Sort(a.class_name,b.class_name));
  if(!sorted.length){box.innerHTML='<div class="empty">В текущем учебном году не найдено активных классов.</div>';return;}
  const submitted=sorted.filter(r=>reportsByClass.has(String(r.class_id))).length;
  const h=term1Headers();
  box.innerHTML=`<div class="table-wrap"><table class="data-table"><thead><tr>${h.map(x=>`<th>${term1Esc(x)}</th>`).join('')}</tr></thead><tbody>${sorted.map(r=>`<tr>${term1Row(r).map(x=>`<td>${term1Esc(x??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="muted">В своде все активные классы учебного года: ${sorted.length}. Отчёты отправили: ${submitted}. Данные отправленного отчёта отображаются в строке соответствующего класса; остальные строки остаются пустыми до отправки. Успеваемость и качество рассчитаны автоматически.</p>`;
 }catch(e){console.error(e);box.innerHTML='<div class="empty">Не удалось загрузить таблицу.</div>';alert('Ошибка просмотра: '+(e.message||e));}
};
window.exportTerm1Summaries=async function(){
 if(!term1Manager())return alert('Выгрузка доступна только директору, заместителям и администратору.');
 try{
  const ctx=window.__term1SummaryContext||await term1Context();
  const rows=await window.sbRest('term1_class_summaries','select=*&academic_year_id=eq.'+ctx.year);
  const sorted=(rows||[]).slice().sort((a,b)=>term1Sort(a.class_name,b.class_name));
  if(!sorted.length)return alert('Нет данных для выгрузки.');
  if(!window.XLSX)return alert('Библиотека Excel не загружена. Обновите страницу.');
  const h=term1Headers(),ws=window.XLSX.utils.aoa_to_sheet([h,...sorted.map(term1Row)]);
  ws['!cols']=h.map((x,i)=>({wch:i===1?16:(i===2?26:(i>=h.length-3?35:22))}));
  const wb=window.XLSX.utils.book_new();window.XLSX.utils.book_append_sheet(wb,ws,'Итоги 1 триместр');
  window.XLSX.writeFile(wb,'Итоги_1_триместр.xlsx');
 }catch(e){console.error(e);alert('Не удалось выгрузить Excel: '+(e.message||e));}
};

  window.App = window.App || {};

        <div class="module-card-title">${title}</div>
