<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Расписание — модуль</title></head><body>
<script type="text/plain" data-module>
/* Единственная реализация обработки и загрузки расписания.
   Общие функции приложения (state, Supabase, права, XLSX, форматирование)
   предоставляет Главная. Отображение страницы принадлежит этому модулю. */
function getScheduleWindowDates(){
  const today=dateIsoLocal(new Date());
  // Для расписания «на завтра» используем следующий учебный день,
  // как и в селекторах интерфейса (с пропуском субботы и воскресенья).
  const tomorrow=dateIsoLocal(nextSchoolDay());
  return {today,tomorrow};
}

async function cleanupOldScheduleRows(today=getScheduleWindowDates().today){
  if(!isDispatcher())return false;
  try{
    await sbMutate('school_schedule_lessons','DELETE',`schedule_date=lt.${encodeURIComponent(today)}`);
    return true;
  }catch(e){
    console.warn('Не удалось удалить устаревшие записи расписания:',e);
    return false;
  }
}

function parseScheduleWorkbook(wb,fileName,selectedShift){
    const ws=wb.Sheets[wb.SheetNames[0]];
    const a=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false});
    let dateIso=null,shift=selectedShift?+selectedShift:null;
    for(const row of a.slice(0,15)){
      for(const cell of (row||[])){
        const d=parseDateFromText(cell);
        if(d){dateIso=d;break;}
      }
      const text=(row||[]).map(cellVal).join(" ");
      const sm=text.match(/([12])\s*(?:смена|см)/i);
      if(sm&&!selectedShift)shift=+sm[1];
      if(dateIso)break;
    }
    const manualDate=document.getElementById("scheduleDate")?.value||"";
    if(manualDate)dateIso=manualDate;
    if(!dateIso)throw new Error("Не удалось определить дату расписания. Укажите дату вручную в поле «Дата расписания».");
    if(!shift)throw new Error("Не выбрана смена.");

    // В файле расписания школы заголовок находится в строке с '#',
    // затем для каждого класса идут две колонки: предмет/кабинет.
    let headerRow=a.findIndex(row=>String(row?.[0]||"").trim()==="#");
    if(headerRow<0){
      headerRow=3;
    }
    const header=a[headerRow]||[];
    const classes=[];
    for(let c=1;c<header.length;c+=2){
      const className=normalizeClass(header[c]);
      if(className)classes.push({className,subCol:c,roomCol:c+1});
    }
    if(!classes.length)throw new Error("Не удалось определить классы в файле.");

    const isLessonNumber=v=>/^\d{1,2}$/.test(cellVal(v));
    const entries=[];
    let r=headerRow+1;
    while(r<a.length){
      if(!isLessonNumber(a[r]?.[0])){r++;continue;}
      const lesson=Number(cellVal(a[r][0]));
      let rr=r+1;
      while(rr<a.length && !isLessonNumber(a[rr]?.[0]))rr++;

      for(const c of classes){
        // Основной предмет располагается в строке номера урока,
        // преподаватель — в следующей строке.
        const subject=cellVal(a[r]?.[c.subCol]);
        const room=cellVal(a[r]?.[c.roomCol]);
        const teacher=cellVal(a[r+1]?.[c.subCol]);
        if(subject && !looksLikeTeacherName(subject)){
          entries.push({id:`${dateIso}_${shift}_${c.className}_${lesson}_${c.subCol}_base`,date:dateIso,shift,lesson,className:c.className,subject,room,teacher,group:0});
        }

        // Дополнительные группы/подгруппы внутри блока урока:
        // каждая реальная дополнительная запись состоит из пары
        // «предмет» + следующая строка «учитель».
        let k=r+2, group=1;
        while(k<rr){
          const extraSubject=cellVal(a[k]?.[c.subCol]);
          const extraTeacher=cellVal(a[k+1]?.[c.subCol]);
          if(extraSubject && !looksLikeTeacherName(extraSubject) && extraTeacher && looksLikeTeacherName(extraTeacher)){
            const extraRoom=cellVal(a[k]?.[c.roomCol])||cellVal(a[k+1]?.[c.roomCol]);
            entries.push({id:`${dateIso}_${shift}_${c.className}_${lesson}_${c.subCol}_g${group}`,date:dateIso,shift,lesson,className:c.className,subject:extraSubject,room:extraRoom,teacher:extraTeacher,group});
            group++;
            k+=2;
          }else{
            k++;
          }
        }
      }
      r=rr;
    }

    // Защита от повторной записи одного и того же урока.
    const seen=new Set();
    const unique=entries.filter(x=>{
      const key=[x.date,x.shift,x.lesson,x.className,x.subject,x.teacher,x.room].join("|");
      if(seen.has(key))return false;
      seen.add(key);return true;
    });
    return {date:dateIso,shift,entries:unique,classes:[...new Set(unique.map(x=>x.className))],fileName};
  }

function parseBaseScheduleWorkbook(wb,fileName,selectedShift){
    const ws=wb.Sheets[wb.SheetNames[0]], a=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false});
    const days=["Понедельник","Вторник","Среда","Четверг","Пятница"];
    const entries=[]; let currentClass="", shift=selectedShift?+selectedShift:null;
    for(let r=0;r<a.length;r++){
      const row=a[r]||[];
      const first=cellVal(row[0]);
      const cm=first.match(/Класс\s*-\s*(.+)/i);
      if(cm){currentClass=normalizeClass(cm[1]);continue;}
      const rowText=row.map(cellVal).join(" ");
      const sm=rowText.match(/([12])\s*(?:смена|см)/i);if(sm&&!shift)shift=+sm[1];
      const lesson=+first;
      if(!currentClass||!lesson||lesson>20)continue;
      for(let c=1;c<=5;c++){
        const subject=cellVal(row[c]);
        if(!subject)continue;
        let teacher="";
        if(r+1<a.length && !+cellVal(a[r+1]?.[0])) teacher=cellVal(a[r+1]?.[c]);
        let group=0;
        let rr=r+1;
        while(rr<a.length && !+cellVal(a[rr]?.[0]) && !String(a[rr]?.[0]||"").toLowerCase().includes("класс -")) rr++;
        for(let k=r+2;k<rr;k++){
          const extra=cellVal(a[k]?.[c]);
          if(extra && !/^[А-ЯЁA-Z][^]*\s[А-ЯЁA-Z]\./u.test(extra) && extra!==subject) {
            // Дополнительный предмет/группа. Учитель обычно следует следующей строкой.
            let extraTeacher=cellVal(a[k+1]?.[c]);
            if(extraTeacher) entries.push({id:`base_${selectedShift}_${currentClass}_${lesson}_${c}_${k}`,shift:+selectedShift,day:days[c-1],dayIndex:c-1,lesson,className:currentClass,subject:extra,teacher:extraTeacher,group:++group});
          }
        }
        entries.push({id:`base_${selectedShift}_${currentClass}_${lesson}_${c}`,shift:+selectedShift,day:days[c-1],dayIndex:c-1,lesson,className:currentClass,subject,teacher,group});
      }
    }
    if(!shift)throw new Error("Не выбрана смена.");
    const valid=entries.filter(x=>x.shift===shift);
    return {shift,entries:valid,classes:[...new Set(valid.map(x=>x.className))],fileName};
  }

async function loadAllBaseScheduleRows(){
  const pageSize=1000;
  const all=[];
  let offset=0;
  while(true){
    const query=`select=*&order=shift.asc,day_index.asc,lesson.asc,class_name.asc,id.asc&limit=${pageSize}&offset=${offset}`;
    const page=await sbRest('school_base_schedule',query);
    if(!Array.isArray(page))throw new Error('Некорректный ответ при загрузке базового расписания.');
    all.push(...page);
    if(page.length<pageSize)break;
    offset+=page.length;
  }
  return all;
}

async function loadScheduleServer(){
  const {today,tomorrow}=getScheduleWindowDates();
  // Удаляем прошлые даты только под учётной записью диспетчера/администратора.
  // Загрузка расписания ограничена сегодняшним и завтрашним днём, чтобы не упираться в лимит REST API.
  await cleanupOldScheduleRows(today);
  const dailyQuery=`select=*&schedule_date=gte.${today}&schedule_date=lte.${tomorrow}&order=schedule_date.asc,shift.asc,lesson.asc,class_name.asc`;
  let daily=await sbRest('school_schedule_lessons',dailyQuery);
  let base=await loadAllBaseScheduleRows();

  // Одноразовая миграция только актуальных записей из старого localStorage.
  if(!(daily||[]).length && isDispatcher() && (state.schedule.entries||[]).length){
    const groups={};
    (state.schedule.entries||[]).filter(x=>x.date>=today&&x.date<=tomorrow).forEach(x=>{const k=`${x.date}::${x.shift}`;(groups[k]??=[]).push(x);});
    for(const arr of Object.values(groups)){
      if(arr.length)await saveScheduleRows({date:arr[0].date,shift:arr[0].shift,entries:arr});
    }
    daily=await sbRest('school_schedule_lessons',dailyQuery);
  }
  if(!(base||[]).length && isDispatcher() && (state.schedule.baseEntries||[]).length){
    const groups={};
    (state.schedule.baseEntries||[]).forEach(x=>{const k=String(x.shift);(groups[k]??=[]).push(x);});
    for(const arr of Object.values(groups)){
      if(arr.length)await saveBaseScheduleRows({shift:arr[0].shift,entries:arr});
    }
    base=await loadAllBaseScheduleRows();
  }
  const mappedDaily=(daily||[]).map(x=>({
    id:Number(x.id),date:x.schedule_date,shift:Number(x.shift),lesson:Number(x.lesson),className:x.class_name,
    subject:x.subject||"",teacher:x.teacher||"",room:x.room||""
  }));
  const seenKeys=new Set();
  state.schedule.entries=mappedDaily.filter(x=>{
    if(!x.subject && !x.teacher)return false;
    if(!x.teacher && looksLikeTeacherName(x.subject))return false;
    const key=[x.date,x.shift,x.lesson,x.className,x.subject,x.teacher,x.room].join("|");
    if(seenKeys.has(key))return false;
    seenKeys.add(key);return true;
  });
  state.schedule.baseEntries=(base||[]).map(x=>({
    id:Number(x.id),shift:Number(x.shift),dayIndex:Number(x.day_index),lesson:Number(x.lesson),className:x.class_name,
    subject:x.subject||'',teacher:x.teacher||'',room:x.room||''
  }));
  state.schedule.versions=(daily||[]).reduce((acc,x)=>{
    const k=`${x.schedule_date}::${x.shift}`;
    if(!acc.some(v=>v.key===k))acc.push({key:k,date:x.schedule_date,shift:Number(x.shift),fileName:''});
    return acc;
  },[]);
  return true;
}

async function saveScheduleRows(parsed){
  const date=parsed.date, shift=Number(parsed.shift), now=new Date().toISOString();
  await sbMutate('school_schedule_lessons','DELETE',`schedule_date=eq.${encodeURIComponent(date)}&shift=eq.${shift}`);
  const rows=(parsed.entries||[]).map(x=>({
    schedule_date:date,shift,lesson:Number(x.lesson)||0,class_name:String(x.className||''),subject:String(x.subject||''),
    teacher:String(x.teacher||''),room:String(x.room||''),uploaded_at:now,uploaded_by:Number(state.currentUser.id)
  }));
  if(rows.length)await sbMutate('school_schedule_lessons','POST','',rows);
}

async function saveBaseScheduleRows(parsed){
  const shift=Number(parsed.shift),now=new Date().toISOString();
  await sbMutate('school_base_schedule','DELETE',`shift=eq.${shift}`);
  const rows=(parsed.entries||[]).map(x=>({
    shift,day_index:Number(x.dayIndex)||0,lesson:Number(x.lesson)||0,class_name:String(x.className||''),subject:String(x.subject||''),
    teacher:String(x.teacher||''),room:String(x.room||''),uploaded_at:now,uploaded_by:Number(state.currentUser.id)
  }));
  if(rows.length)await sbMutate('school_base_schedule','POST','',rows);
}

window.uploadSchedule=function(){
    if(!isDispatcher())return alert("Загрузка расписания доступна только диспетчеру и администратору.");
    const f=document.getElementById("scheduleFile")?.files[0], selectedShift=document.getElementById("scheduleShift")?.value;
    if(!f)return alert("Выберите Excel-файл расписания.");
    if(!selectedShift)return alert("Укажите, это 1-я или 2-я смена.");
    const reader=new FileReader();
    reader.onload=async e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:"array"});
        const parsed=parseScheduleWorkbook(wb,f.name,selectedShift);
        const {today,tomorrow}=getScheduleWindowDates();
        if(parsed.date!==today&&parsed.date!==tomorrow)throw new Error("Можно загружать расписание только на сегодня или завтра.");
        // Сначала сохраняем данные на сервере. Если запись не удалась, локально
        // не показываем загрузку как успешную и не очищаем старые строки.
        await saveScheduleRows(parsed);
        await cleanupOldScheduleRows(today);
        const old=state.schedule.entries.filter(x=>x.date===parsed.date&&x.shift===parsed.shift);
        state.schedule.entries=state.schedule.entries.filter(x=>x.date>=today&&x.date<=tomorrow&&!(x.date===parsed.date&&x.shift===parsed.shift));
        state.schedule.entries.push(...parsed.entries);
        const now=new Date().toISOString();
        const version={id:Date.now(),date:parsed.date,shift:parsed.shift,fileName:f.name,uploadedAt:now,count:parsed.entries.length,readBy:{[state.currentUser.login]:{at:now}}};
        state.schedule.versions=(state.schedule.versions||[]).filter(v=>v.date>=today&&v.date<=tomorrow&&!(v.date===parsed.date&&v.shift===parsed.shift));
        state.schedule.versions.push(version);state.schedule.uploadedFile=f.name;
        save();
        const info=document.getElementById("scheduleImportInfo");
        if(info)info.innerHTML=`Распознано: <b>${parsed.date}</b>, <b>${parsed.shift}-я смена</b>, классов: <b>${parsed.classes.length}</b>, записей уроков: <b>${parsed.entries.length}</b>. ${old.length?"Предыдущее расписание этой даты и смены заменено.":"Расписание добавлено."}`;
        alert(`Расписание сохранено на сервере: ${parsed.date}, ${parsed.shift}-я смена, ${parsed.entries.length} записей.`);
        render();
      }catch(err){console.error(err);alert("Не удалось загрузить расписание: "+(err.message||"проверьте формат Excel."));}
    };
    reader.readAsArrayBuffer(f);
  };

window.uploadBaseSchedule=async function(){
  if(!isDispatcher())return alert('Загрузка базового расписания доступна только диспетчеру и администратору.');
  const f=document.getElementById('baseScheduleFile')?.files?.[0], selectedShift=document.getElementById('baseScheduleShift')?.value;
  if(!f)return alert('Выберите Excel-файл базового расписания.');
  if(!selectedShift)return alert('Укажите, это 1-я или 2-я смена.');
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'}),parsed=parseBaseScheduleWorkbook(wb,f.name,selectedShift);
      await saveBaseScheduleRows(parsed);
      state.schedule.baseEntries=(state.schedule.baseEntries||[]).filter(x=>Number(x.shift)!==Number(parsed.shift)).concat(parsed.entries);
      state.schedule.baseVersions=(state.schedule.baseVersions||[]).filter(v=>Number(v.shift)!==Number(parsed.shift));
      state.schedule.baseVersions.push({id:Date.now(),shift:Number(parsed.shift),fileName:f.name,uploadedAt:new Date().toISOString(),count:parsed.entries.length});
      state.schedule.baseUploadedFile=f.name;save();
      const info=document.getElementById('baseScheduleImportInfo');if(info)info.innerHTML=`Распознано: <b>${parsed.shift}-я смена</b>, классов: <b>${parsed.classes.length}</b>, записей: <b>${parsed.entries.length}</b>.`;
      alert(`Базовое расписание ${parsed.shift}-й смены загружено.`);render();
    }catch(err){console.error(err);alert('Не удалось сохранить базовое расписание: '+(err.message||'проверьте формат Excel и права доступа.'));}
  };
  reader.readAsArrayBuffer(f);
};

/* Schedule selectors and class/teacher filtering moved from the main module. */
// Daily schedule selectors: class and teacher filters share the same loaded server rows.
function scheduleViewerCanChooseAnyClass(){
  const user=state.currentUser||{};
  const roles=Array.isArray(user.roleKeys)?user.roleKeys:[];
  const roleText=[user.role,user.roles,user.system_role,user.systemRole].filter(Boolean).join(' ').toLowerCase();
  return ['admin','director','deputy'].some(r=>roles.includes(r))||/администратор|директор|заместител|\badmin\b|\bdirector\b|\bdeputy\b/.test(roleText)||isGuest();
}
function scheduleViewerClasses(){
  const all=[...(state.classRoster||[]).map(x=>x?.name),...(state.schedule.entries||[]).map(x=>x?.className),...(state.schedule.baseEntries||[]).map(x=>x?.className)]
    .filter(Boolean).map(x=>String(x).trim());
  return [...new Set(all)].sort(classSort);
}
function scheduleViewerTeachers(){
  // Источник списка — сотрудники из state.users. Не добавляем teacher из строк
  // расписания: там могут встречаться предметы и сокращённые варианты ФИО.
  const scheduleTeacherNames=[...(state.schedule.entries||[]),...(state.schedule.baseEntries||[])]
    .map(x=>String(x?.teacher||'').trim()).filter(Boolean);
  const candidates=(state.users||[])
    .filter(u=>u.name&&!u.roleKeys?.includes('guest')&&(
      u.roleKeys?.some(role=>['teacher','class_teacher'].includes(role))||
      scheduleTeacherNames.some(name=>teacherMatches(name,u.name))
    ))
    .map(u=>String(u.name).trim())
    .filter(Boolean)
    .sort((a,b)=>b.split(/\s+/).length-a.split(/\s+/).length||a.localeCompare(b,'ru'));
  const unique=[];
  for(const name of candidates){
    if(!unique.some(existing=>teacherMatches(name,existing)||teacherMatches(existing,name)))unique.push(name);
  }
  return unique.sort((a,b)=>a.localeCompare(b,'ru'));
}
function scheduleViewerControls(day,home=false){
  const classes=scheduleViewerClasses();
  const teachers=scheduleViewerTeachers();
  const mineId=home?"homeScheduleMine_"+day:"scheduleMine_"+day;
  const classId=home?"homeScheduleChoice_"+day:"scheduleChoice_"+day;
  const teacherId=home?"homeScheduleTeacherChoice_"+day:"scheduleTeacherChoice_"+day;
  const resultId=home?"homeScheduleResult_"+day:"scheduleResult_"+day;
  const leaderClasses=[...new Set((state.currentUser?.classes||[]).filter(Boolean).map(c=>String(c).trim()))].sort(classSort);
  const mineOptions='<option value="">Мой класс / моё расписание</option>'+
    '<option value="teacher:'+escapeHtml(state.currentUser?.name||'')+'">Моё расписание</option>'+
    leaderClasses.map(c=>'<option value="class:'+escapeHtml(c)+'">Мой класс — '+escapeHtml(c)+'</option>').join('');
  const classOptions=classes.map(c=>'<option value="class:'+escapeHtml(c)+'">'+escapeHtml(c)+'</option>').join('');
  const teacherOptions=teachers.map(t=>'<option value="teacher:'+escapeHtml(t)+'">'+escapeHtml(t)+'</option>').join('');
  const handler=home?'showHomeScheduleChoice':'showScheduleChoice';
  return '<div class="schedule-choice" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">'+
    '<select id="'+mineId+'" aria-label="Мой класс или моё расписание" onchange="'+handler+'(\''+day+'\')">'+mineOptions+'</select>'+
    '<select id="'+classId+'" aria-label="Класс" onchange="'+handler+'(\''+day+'\')"><option value="">Класс</option>'+classOptions+'</select>'+
    '<select id="'+teacherId+'" aria-label="Учителя" onchange="'+handler+'(\''+day+'\')"><option value="">Учителя</option>'+teacherOptions+'</select>'+
    '</div>'+(home?'<div class="muted">Выберите один из трёх фильтров.</div>':'')+
    '<div id="'+resultId+'" style="margin-top:12px"><div class="schedule-empty">Выберите один из трёх фильтров.</div></div>';
}
renderScheduleSelector=function(day){return scheduleViewerControls(day,false);};
renderScheduleHomeSelector=function(day='today'){return scheduleViewerControls(day,true);};
function renderScheduleSelection(day,home=false){
  const mineId=home?"homeScheduleMine_"+day:"scheduleMine_"+day;
  const classId=home?"homeScheduleChoice_"+day:"scheduleChoice_"+day;
  const teacherId=home?"homeScheduleTeacherChoice_"+day:"scheduleTeacherChoice_"+day;
  const resultId=home?"homeScheduleResult_"+day:"scheduleResult_"+day;
  const mineSel=document.getElementById(mineId),classSel=document.getElementById(classId);
  const teacherSel=document.getElementById(teacherId),result=document.getElementById(resultId);
  if(!mineSel||!classSel||!teacherSel||!result)return;
  const dt=day==='tomorrow'?nextSchoolDay():new Date();
  const mode=mineSel.value||classSel.value||teacherSel.value;
  if(mineSel.value){classSel.value='';teacherSel.value='';}
  else if(classSel.value){mineSel.value='';teacherSel.value='';}
  else if(teacherSel.value){mineSel.value='';classSel.value='';}
  result.innerHTML=mode?renderScheduleTable(getScheduleForDate(dateIsoLocal(dt)),mode):'<div class="schedule-empty">Выберите один из трёх фильтров.</div>';
}
window.showScheduleChoice=function(day){renderScheduleSelection(day,false);};
window.showHomeScheduleChoice=function(day='today'){renderScheduleSelection(day,true);};
renderBaseScheduleSelector=function(){
  const classes=[...new Set([...(state.classRoster||[]).map(x=>x.name),...(state.schedule.baseEntries||[]).map(x=>x.className)].filter(Boolean).map(x=>String(x).trim()))].sort(classSort);
  return `<div class="schedule-choice"><select id="baseScheduleChoice" onchange="showBaseScheduleChoice()"><option value="">Выберите класс</option>${classes.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}</select></div><div class="muted">Выберите класс, чтобы увидеть базовое расписание.</div><div id="baseScheduleResult" style="margin-top:12px"><div class="schedule-empty">Класс не выбран.</div></div>`;
};

window.showBaseScheduleChoice=function(){
    const c=document.getElementById("baseScheduleChoice")?.value;if(!c)return;
    const arr=(state.schedule.baseEntries||[]).filter(x=>x.className===c);
    if(!arr.length){document.getElementById("baseScheduleResult").innerHTML='<div class="schedule-empty">Базовое расписание для класса не найдено.</div>';return;}
    const shifts=[...new Set(arr.map(x=>x.shift))];
    const days=["Понедельник","Вторник","Среда","Четверг","Пятница"];
    let html=`<div class="schedule-shift">Смена: ${escapeHtml(shifts.join(", "))}</div><div class="table-wrap"><table class="data-table"><tr><th>Урок</th>${days.map(d=>`<th>${d}</th>`).join("")}</tr>`;
    for(let lesson=1;lesson<=20;lesson++){
      if(!arr.some(x=>x.lesson===lesson))continue;
      html+=`<tr><td>${lesson}</td>${days.map((_,i)=>{const cells=arr.filter(x=>x.lesson===lesson&&x.dayIndex===i);const cell=cells.map(x=>escapeHtml(x.subject)+(x.teacher?"<br><span class=\"muted\">"+escapeHtml(x.teacher)+"</span>":"")).join("<hr style=\"border:0;border-top:1px solid var(--line);margin:5px 0\">")||"—";return "<td>"+cell+"</td>";}).join("")}</tr>`;
    }
    html+=`</table></div>`;
    document.getElementById("baseScheduleResult").innerHTML=html;
  };


function renderScheduleModule(){
  const canDispatch=isDispatcher();
  if(isGuest()){renderGuestSchedulePage();return;}
  const d=dateInfo(), tomorrow=nextSchoolDay();
  const newSched=hasUnreadSchedule();
  shell("Расписание",`Расписание уроков. ${newSched?'<span class="schedule-new-badge">● есть непрочитанные изменения</span>':''}`,
    `<div class="schedule-page-grid">
      <div class="card ${newSched?'schedule-new':''}">
        <h3>Расписание на сегодня <span class="muted">(${d.full})</span></h3>
        ${renderScheduleSelector("today")}
      </div>
      <div class="card">
        <h3>Расписание на завтра <span class="muted">(${tomorrow.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})})</span></h3>
        ${renderScheduleSelector("tomorrow")}
      </div>
      <div class="card">
        <h3>Базовое расписание</h3>
        ${renderBaseScheduleSelector()}
      </div>
    </div>
    ${canDispatch?`<div class="card" style="margin-top:16px"><h3>Загрузка расписания на конкретную дату</h3>
      <div class="schedule-import-grid"><div><label>Файл расписания</label><input id="scheduleFile" type="file" accept=".xlsx,.xls,.csv"></div><div><label>Дата расписания</label><input id="scheduleDate" type="date" value="${dateIsoLocal(nextSchoolDay())}"></div><div><label>Смена</label><select id="scheduleShift"><option value="">Выберите смену</option><option value="1">1 смена</option><option value="2">2 смена</option></select></div></div>
      <p class="muted">Загрузить расписание может только диспетчер или администратор. При повторной загрузке той же даты и смены предыдущая версия полностью заменяется.</p>
      <button class="btn green" style="margin-top:12px" onclick="uploadSchedule()">Загрузить и опубликовать</button><div id="scheduleImportInfo" class="muted" style="margin-top:10px"></div>
    </div>
    <div class="card" style="margin-top:16px"><h3>Загрузка базового расписания</h3>
      <div class="schedule-import-grid"><div><label>Файл базового расписания</label><input id="baseScheduleFile" type="file" accept=".xlsx,.xls,.csv"></div><div><label>Смена</label><select id="baseScheduleShift"><option value="">Выберите смену</option><option value="1">1 смена</option><option value="2">2 смена</option></select></div></div>
      <p class="muted">Базовых расписаний два — для 1-й и 2-й смен. Новая загрузка выбранной смены полностью заменяет старое базовое расписание этой смены.</p>
      <button class="btn green" style="margin-top:12px" onclick="uploadBaseSchedule()">Загрузить базовое расписание</button><div id="baseScheduleImportInfo" class="muted" style="margin-top:10px"></div>
    </div>`:""}`);
  if(newSched) markScheduleRead();
}
window.App=window.App||{};
window.App.pageRenderers=window.App.pageRenderers||{};
window.App.pageRenderers.schedule=renderScheduleModule;
</script>
</body></html>
